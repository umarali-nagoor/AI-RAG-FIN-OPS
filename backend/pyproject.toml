[project]
name = "finops-copilot"
version = "1.0.0"
description = "RAG-powered FinOps Copilot for IBM Cloud Logs"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
