# Allow-list of repositories the copilot may analyse.
#
# Two ways to register repositories:
#
# 1. repositories: — explicit entries with local path OR full HTTPS clone URL.
#      path: local checkout (relative paths are resolved from this file's directory)
#      url:  https clone URL (checked out under FINOPS_DATA_DIR/repos)
#            credentials come from FINOPS_GIT_TOKEN (http.extraHeader — never embedded in URL)
#
# 2. github_repos: — shorthand blocks.  Specify an org and the exact repo names you want.
#      The copilot builds the URL as https://github.com/{org}/{repo} for each entry.
#      Repositories listed under `repositories:` above take precedence (not duplicated).
#      Each repo entry can be a plain name string or an object with name/description/branch.
#
# Example github_repos block (uncomment and fill in):
# github_repos:
#   - org: my-github-org
#     repos:
#       - repo-alpha
#       - repo-beta
#       - name: repo-gamma
#         description: "Custom description"
#         branch: develop

github_repos:
  - org: umarali-nagoor
    repos:
      - name: icl-test-blueprint-api
        description: Blueprint catalogue API
      - name: icl-test-schematics-api
        description: Public Schematics REST API
      - name: icl-test-schematics-agents-api
        description: API used by Schematics agents
      - name: icl-test-schematics-orchestrator
        description: Job orchestration service
      - name: icl-test-schematics-sandbox
        description: Sandbox lifecycle manager
      - name: icl-test-schematics-data-job
        description: Nightly data export job
      - name: icl-test-schematics-job-queue-manager
        description: Kafka job queue consumer and scheduler
      - name: icl-test-schematics-job
        description: Single Terraform job runner
      - name: icl-test-schematics-ansible
        description: Ansible runner wrapper
      - name: icl-test-schematics-mon
        description: Health metrics collector
      - name: AI-RAG-PR-SAMPLE
        description: AI RAG pipeline — FinOps PR Review sample (4 open PRs)
